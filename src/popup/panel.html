<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ScopeCreep Notary</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0a0a;
    --panel: #111111;
    --line: #1f1f1f;
    --line-strong: #2a2a2a;
    --ink: #e6e6e6;
    --muted: #9ca3af;
    --dim: #6b7280;
    --accent: #d4a64a;
    --warn: #c95a4a;
    --ok: #34d399;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 420px;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  header .name {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink);
  }
  header .name .slash { color: var(--muted); margin: 0 6px; }
  header .ver {
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
  }

  /* Main body */
  main { padding: 18px 20px 12px; }

  /* Section labels */
  .label {
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 14px 0 8px;
    font-weight: 600;
  }
  .label:first-child { margin-top: 0; }

  /* Quoted message */
  .quote {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    padding: 10px 14px;
    font-size: 13px;
    color: var(--ink);
    border-radius: 0 6px 6px 0;
    max-height: 140px;
    overflow-y: auto;
    line-height: 1.5;
  }

  /* Hit list */
  .hits { display: flex; flex-direction: column; gap: 6px; }
  .hit {
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-size: 12px;
    padding: 6px 0;
    border-bottom: 1px solid var(--line);
  }
  .hit:last-child { border-bottom: 0; }
  .hit .phrase {
    color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    flex: 1;
  }
  .hit .meta {
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .hit .sev {
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 3px;
  }
  .hit .sev.low    { background: rgba(156,163,175,.14); color: #d1d5db; border: 1px solid rgba(156,163,175,.32); }
  .hit .sev.medium { background: rgba(212,166,74,.14);  color: var(--accent); border: 1px solid rgba(212,166,74,.32); }
  .hit .sev.high   { background: rgba(201,90,74,.14);   color: var(--warn);   border: 1px solid rgba(201,90,74,.32); }

  /* Draft */
  textarea#draft {
    width: 100%;
    min-height: 220px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    line-height: 1.6;
    padding: 12px 14px;
    border-radius: 6px;
    resize: vertical;
  }
  textarea#draft:focus {
    outline: none;
    border-color: var(--line-strong);
  }

  /* Buttons */
  .actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  button {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    padding: 8px 14px;
    border-radius: 5px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
  }
  button:hover { background: #161616; border-color: var(--line-strong); }
  button.primary { background: var(--accent); color: #0a0a0a; border-color: var(--accent); }
  button.primary:hover { background: #e6b85a; border-color: #e6b85a; }
  button.primary.copied { background: var(--ok); border-color: var(--ok); }
  button.ghost { color: var(--muted); }
  button.ghost:hover { color: var(--ink); }

  /* Footer */
  footer {
    padding: 12px 20px 16px;
    border-top: 1px solid var(--line);
    color: var(--dim);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  /* Empty state */
  .empty {
    padding: 32px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
  }
  .empty .icon {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 24px;
    color: var(--dim);
    letter-spacing: 0.1em;
    margin-bottom: 12px;
  }
  .empty .hint {
    font-size: 11px;
    color: var(--dim);
    margin-top: 12px;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>

<header>
  <div class="name">ScopeCreep <span class="slash">/</span> Notary</div>
  <div class="ver" id="ver">v0.2.0</div>
</header>

<main id="main">
  <div class="empty" id="empty">
    <div class="icon">— · —</div>
    <div>No flagged messages yet.</div>
    <div class="hint">Open Slack in another tab. Flagged client messages will appear here when you click their badge.</div>
  </div>

  <div id="content" style="display:none;">
    <div class="label">Flagged message</div>
    <div class="quote" id="quote">—</div>

    <div class="label">Detected patterns <span id="hit-count" style="color: var(--dim); font-weight: 400; margin-left: 4px;"></span></div>
    <div class="hits" id="hits"></div>

    <div class="label">Suggested change-order email</div>
    <textarea id="draft" spellcheck="true"></textarea>

    <div class="actions">
      <button class="primary" id="copy-btn">Copy to clipboard</button>
      <button class="ghost" id="dismiss-btn">Dismiss</button>
    </div>
  </div>
</main>

<footer>
  <div>schema v1 · local-only</div>
  <a href="#" id="settings-link">Set rate &amp; SOW</a>
</footer>

<script src="panel.js"></script>
</body>
</html>
