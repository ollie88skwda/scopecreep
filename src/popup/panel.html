<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ScopeCreep Notary</title>
<style>
  :root { color-scheme: dark; --bg: #0a0a0a; --ink: #e6e6e6; --muted: #9ca3af; --line: #1f1f1f; --accent: #818cf8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 360px; padding: 18px 20px; background: var(--bg); color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13px; line-height: 1.5; }
  h1 { font-size: 14px; letter-spacing: 0.04em; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; }
  .empty { color: var(--muted); padding: 16px 0; text-align: center; font-size: 12px; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
</style>
</head>
<body>
  <h1>ScopeCreep Notary</h1>
  <div class="sub">v0.1.0 · placeholder</div>
  <hr>
  <div class="empty">No flagged messages yet.<br>Real panel UI lands in T-014.</div>
  <script src="panel.js"></script>
</body>
</html>
