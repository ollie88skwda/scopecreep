<!--
  ScopeCreep — sc-dot-pattern
  Subtle SVG dot grid for hero / section backgrounds. Static (no motion).
  Edge fade via CSS mask. Pair with absolutely-positioned children for content.

  Usage:
    <div class="sc-dot-pattern">
      <svg class="sc-dot-pattern__svg" aria-hidden="true">
        <defs>
          <pattern id="sc-dots" width="24" height="24" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="1" />
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#sc-dots)" />
      </svg>
      <div class="sc-dot-pattern__content"> ... your content ... </div>
    </div>
-->
<div class="sc-dot-pattern">
  <svg class="sc-dot-pattern__svg" aria-hidden="true" focusable="false">
    <defs>
      <pattern id="sc-dots" width="24" height="24" patternUnits="userSpaceOnUse" x="0" y="0">
        <circle cx="1" cy="1" r="1" />
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#sc-dots)" />
  </svg>
  <div class="sc-dot-pattern__content">
    <!-- consumer content -->
  </div>
</div>

<style>
  /* Scoped: every selector starts with .sc-dot-pattern */
  .sc-dot-pattern {
    position: relative;
    width: 100%;
    overflow: hidden;
    border-radius: var(--r-md);
    background: var(--bg);
  }

  .sc-dot-pattern__svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    color: var(--line-strong);            /* dot color via currentColor */
    pointer-events: none;
    /* Radial edge fade — dots strongest at center, vanish at edges */
    -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
            mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
  }

  .sc-dot-pattern__svg circle { fill: currentColor; }

  .sc-dot-pattern__content {
    position: relative;
    z-index: 1;
  }

  /* Reduced motion: no animation in this component, but document the contract. */
  @media (prefers-reduced-motion: reduce) {
    .sc-dot-pattern__svg { /* static — nothing to disable */ }
  }
</style>
